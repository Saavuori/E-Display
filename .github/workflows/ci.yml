name: CI

# The Docker build only runs on pushes to main, so until this existed a pull
# request had no checks at all. Auto-merge needs something to wait for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# One run per branch; a new push supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Python backend ────────────────────────────────────────────────────────
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Pinned to a full version: setup-uv publishes no moving `v9` major tag.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --locked fails rather than silently resolving, so a Dependabot PR that
      # edits pyproject.toml without refreshing uv.lock is caught here.
      # The `pi` extra is deliberately excluded: RPi.GPIO and spidev are source
      # distributions that only build on the Pi itself.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  # ── Web UI ────────────────────────────────────────────────────────────────
  web-ui:
    name: next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Matches web-ui/Dockerfile. Bump both together.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

name: Dependabot auto-merge

# Minor and patch bumps land on their own once CI is green; majors stay open
# for a human. The gate is only as good as CI, so this workflow is worth no
# more than the checks in ci.yml.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # For a grouped PR, update-type reports the *highest* bump in the group,
      # so one major hiding among patches blocks the whole PR rather than
      # riding along with it.
      - name: Enable auto-merge for minor and patch
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

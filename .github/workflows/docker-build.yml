name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_WEBUI: ${{ github.repository }}/web-ui

jobs:
  # ── Which half of the repo actually changed? ──────────────────────────────
  # The two build jobs run in parallel, so an unnecessary web-ui build sets the
  # wall clock for the whole workflow. Most commits touch only one side.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      webui: ${{ steps.filter.outputs.webui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # paths-filter needs history to diff against

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '*.py'
              - 'lib/**'
              - 'font/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/docker-build.yml'
            webui:
              - 'web-ui/**'
              - '.github/workflows/docker-build.yml'

  # ── Shared: bump semver tag from conventional commit prefix ──────────────
  tag-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend (Python FastAPI) ──────────────────────────────────────────────
  build-backend:
    needs: [tag-version, changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    # Native arm64 runner — free for public repos, and it removes the QEMU
    # emulation that dominated this job's runtime.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # github.repository preserves the owner's capitalisation (Saavuori/E-Display)
      # but Docker references must be lowercase. metadata-action normalises the
      # tags it generates; the cache refs below are raw, so do it explicitly.
      - name: Normalize image name
        run: echo "IMAGE_LC=${IMAGE_NAME_BACKEND,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag-version.outputs.new_tag }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.tag-version.outputs.new_tag }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache instead of type=gha: the Actions cache evicts entries
          # after 7 days of no access, so with pushes weeks apart it was always
          # cold — paying the export cost every run and never getting a hit.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache,mode=max

  # ── Web UI (Next.js) ─────────────────────────────────────────────────────
  build-webui:
    needs: [tag-version, changes]
    if: needs.changes.outputs.webui == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        run: echo "IMAGE_LC=${IMAGE_NAME_WEBUI,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEBUI }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag-version.outputs.new_tag }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./web-ui
          file: ./web-ui/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.tag-version.outputs.new_tag }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache,mode=max

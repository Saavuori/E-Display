name: PR Checks

# These two job names are not cosmetic: main's branch protection requires the
# contexts "pytest" and "next build" by name. They were required long before any
# workflow produced them, which left auto-merge waiting on checks that could
# never report. Renaming a job here silently breaks merging again.
on:
  pull_request:
    branches: ["main"]

# No paths-ignore on purpose: a required status check must always report a
# result, otherwise doc-only PRs stay pending forever and block merge.

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Plain `uv sync` deliberately: the `pi` extra pulls RPi.GPIO and spidev,
      # which only build on real hardware. The tests do not touch them.
      - name: Install
        run: uv sync

      - name: Test
        run: uv run pytest

  next-build:
    name: next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 20 matches web-ui/Dockerfile, so CI compiles on the same major
      # that ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install
        working-directory: web-ui
        run: npm ci

      - name: Lint
        working-directory: web-ui
        run: npm run lint

      - name: Build
        working-directory: web-ui
        run: npm run build
